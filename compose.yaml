services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env.production}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEV_LOGIN_ENABLED: "false"
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.production}
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.production}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - database

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ./app.js:/srv/app.js:ro
      - ./style.css:/srv/style.css:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  database:
    internal: true
